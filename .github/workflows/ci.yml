name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bump to force the punctuation model to rebuild without touching the scripts.
  PUNCTUATION_CACHE_VERSION: v1

jobs:
  # Builds the punctuation model once (Scripts/make-punctuation-model.sh) and caches it, so the
  # tests run against the real model instead of skipping, and the app has the resources it bundles.
  # A cache hit makes this job a few seconds; a miss is a ~200 MB download plus a uv Python stack.
  punctuation-model:
    name: Punctuation model
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=punctuation-${{ env.PUNCTUATION_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('Scripts/make-punctuation-model.sh', 'Scripts/punctuation_model.py') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: .models/punctuation
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        # setup-uv no longer publishes floating major tags, so it is pinned exactly.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # The model cache above is what matters; uv's own cache would only be saved on a miss.
          enable-cache: false
      - if: steps.cache.outputs.cache-hit != 'true'
        run: Scripts/make-punctuation-model.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .models/punctuation
          key: ${{ steps.key.outputs.key }}

  test:
    name: swift test
    needs: punctuation-model
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # testThisRepositorysHistoryIsConventional reads the whole git log.
          fetch-depth: 0
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - uses: actions/cache/restore@v6
        with:
          path: .models/punctuation
          key: ${{ needs.punctuation-model.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: swift test
        run: swift test

  app:
    name: iOS app (simulator build)
    needs: punctuation-model
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The app's changelog build phase writes the git history into the bundle.
          fetch-depth: 0
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/cache/restore@v6
        with:
          path: .models/punctuation
          key: ${{ needs.punctuation-model.outputs.key }}
          fail-on-cache-miss: true
      - name: Install xcodegen
        run: command -v xcodegen || brew install xcodegen
      - name: Generate project
        run: cd App && xcodegen generate --quiet
      - uses: actions/cache@v6
        with:
          path: .sim/dd/SourcePackages
          key: app-spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'App/project.yml') }}
          restore-keys: app-spm-${{ runner.os }}-
      - name: Build for the iOS Simulator
        run: |
          status=0
          xcodebuild -project App/OpenCaptions.xcodeproj -scheme OpenCaptions \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .sim/dd \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || status=$?
          grep -E 'error:|warning: .*App/Sources' build.log | sort -u | head -80 || true
          tail -5 build.log
          exit $status
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-build-log
          path: build.log

  # The release scripts' own tests: versioning from conventional commits, and release notes.
  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test Scripts/release.py
        run: python3 -m unittest discover -s Scripts -p 'test_*.py' -v

  # The unsigned sideload IPA, built exactly as a release builds it, so a broken release build
  # shows up here rather than when a version is cut. Scripts/make-ipa.sh checks the bundle.
  ipa:
    name: Sideload IPA (device build)
    needs: punctuation-model
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # For the build number (commit count), the next version, and the in-app changelog.
          fetch-depth: 0
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/cache/restore@v6
        with:
          path: .models/punctuation
          key: ${{ needs.punctuation-model.outputs.key }}
          fail-on-cache-miss: true
      - name: Install xcodegen
        run: command -v xcodegen || brew install xcodegen
      - uses: actions/cache@v6
        with:
          path: .ipa/dd/SourcePackages
          key: ipa-spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'App/project.yml') }}
          restore-keys: ipa-spm-${{ runner.os }}-
      - name: Build the IPA
        run: |
          # Versioned as the next release would be; 0.0.0 when nothing has changed since the last.
          version=$(python3 -I Scripts/release.py next-version 2>/dev/null || echo 0.0.0)
          Scripts/make-ipa.sh "$version" "$(git rev-list --count HEAD)"
      - uses: actions/upload-artifact@v7
        with:
          name: OpenCaptions-ipa
          path: .ipa/OpenCaptions-*.ipa*
          # .ipa/ is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ipa-build-log
          path: .ipa/build.log
          # .ipa/ is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
